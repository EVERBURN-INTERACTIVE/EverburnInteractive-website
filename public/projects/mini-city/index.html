<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini City — Everburn Interactive</title>
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: #020111;
        font-family: system-ui, sans-serif;
        touch-action: none;
      }
      #flamecore-canvas {
        width: 100vw;
        height: 100vh;
        display: block;
        opacity: 0;
        transition: opacity 0.55s ease;
        touch-action: none;
      }
      #hud {
        position: fixed;
        left: 16px;
        bottom: 16px;
        color: rgba(255, 214, 165, 0.85);
        font-size: 12px;
        letter-spacing: 0.04em;
        pointer-events: none;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
        opacity: 0;
        transition: opacity 0.6s ease 0.2s;
      }
      #title {
        position: fixed;
        top: 20px;
        left: 24px;
        color: rgba(255, 230, 200, 0.92);
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.6s ease 0.15s;
      }
      body.is-ready #title,
      body.is-ready #hud {
        opacity: 1;
      }
      body.is-ready #flamecore-canvas {
        opacity: 1;
      }

      /* Everburn-branded boot loading overlay */
      #load-screen {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        gap: 1rem;
        background: #020111;
        color: rgba(255, 214, 165, 0.92);
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      #load-screen.load-screen--hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .eb-load-logo {
        width: min(460px, 76vw);
        height: auto;
        filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.45));
      }
      .load-track {
        width: min(320px, 80vw);
        height: 8px;
        background: rgba(255, 255, 255, 0.15);
        overflow: hidden;
      }
      #load-bar {
        height: 100%;
        width: 0%;
        background: #ff6a00;
        transition: width 0.2s linear;
      }
      .load-meta {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        width: min(320px, 80vw);
        font-size: 12px;
        color: rgba(255, 214, 165, 0.78);
      }
      #load-label {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #load-percent {
        font-variant-numeric: tabular-nums;
        color: rgba(255, 230, 200, 0.9);
      }
      #load-error {
        margin: 0;
        width: min(320px, 80vw);
        font-size: 12px;
        line-height: 1.45;
        color: #ff9a9a;
        text-align: center;
      }
      #load-error[hidden] {
        display: none;
      }
      .load-screen--error .load-track #load-bar {
        background: #a04040;
      }
      body.is-loading #title,
      body.is-loading #hud {
        opacity: 0;
      }
      @media (max-width: 720px) {
        #title {
          top: 14px;
          left: 14px;
          font-size: 12px;
        }
        #hud {
          left: 14px;
          right: 14px;
          bottom: 12px;
          font-size: 11px;
        }
      }
    </style>
    <script type="module" crossorigin src="/projects/mini-city/assets/index-Duv73ENo.js"></script>
  </head>
  <body>
    <div id="load-screen" aria-live="polite" aria-busy="true">
      <img class="eb-load-logo" src="/projects/_brand/EverFlame-with-Name.png" alt="Everburn Interactive" />
      <div class="load-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Loading progress">
        <div id="load-bar"></div>
      </div>
      <div class="load-meta">
        <span id="load-label">Starting up…</span>
        <span id="load-percent">0%</span>
      </div>
      <p id="load-error" hidden></p>
    </div>
    <div id="title">Mini City</div>
    <canvas id="flamecore-canvas"></canvas>
    <div id="hud"><span id="hud-fps">— fps</span> · drag to pan · scroll to zoom · F follow ship · Esc release</div>
  </body>
</html>
